services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DB_DRIVER: postgres
      DB_DSN: host=postgres user=marketplace password=marketplace dbname=marketplace port=5432 sslmode=disable
      STORAGE: gorm
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
